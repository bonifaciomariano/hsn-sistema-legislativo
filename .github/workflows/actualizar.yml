name: Actualizar datos legislativos

# Dos franjas separadas para no mezclar el scraper pesado (proyectos, ~5-6
# min y muchas requests) con los livianos: si un scraper agota el
# rate-limit del sitio para la IP del runner, los que corren después en el
# MISMO job fallan en cascada (visto en la práctica: DPP, agenda y OD
# volvían con 0 resultados corriendo justo después de proyectos). Separarlos
# por horario, además de reordenar liviano-antes-que-pesado dentro de cada
# franja, reduce ese riesgo.
#
# Corre TODOS los días (sin excepciones de día de semana) para no tener que
# llevar la cuenta de qué noches/mañanas quedan cubiertas por el cron -- los
# scrapers son incrementales, así que una corrida que no encuentra nada
# nuevo es un no-op inofensivo.
#
# agenda corre en las DOS franjas a propósito: si a la noche el boletín
# todavía no fue publicado, la corrida de la mañana siguiente lo reintenta
# (es incremental vía data/boletines_procesados.json, así que repetirlo no
# tiene costo cuando no hay nada nuevo).
#
# Sanciones (Boletín de Novedades) vuelve a correr en la franja de la noche.
# El endpoint (micrositios/DatosAbiertos) a veces devuelve "Request Rejected":
# el scraper reintenta 3 veces con espera y el paso es continue-on-error, así
# que si falla no frena nada y se reintenta en la corrida siguiente.
on:
  schedule:
    # 9:00 Argentina (UTC-3) = 12:00 UTC, todos los días → DPP + agenda
    - cron: "0 12 * * *"
    # 22:00 Argentina (UTC-3) = 01:00 UTC del día siguiente, todos los días → OD + agenda + proyectos
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      reprocesar_sanciones:
        description: "Sanciones: boletines a volver a leer (ej. 8/26,9/26,10/26). Dejar vacío en el uso normal."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ── Franja 9:00 ART: DPP + agenda (livianos) ─────────────────────────
      # ── Padrón de senadores (bloques/vigencia) desde el Senado: va ANTES de DPP ──
      - name: Actualizar padrón de senadores (Senado)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
        continue-on-error: true
        env:
          ACTUALIZAR: "1"
          SENADORES_BLOQUES_URL: ${{ vars.SENADORES_BLOQUES_URL }}
        run: python scripts/scraper_senadores.py

      # Integrantes y cargos de cada comisión desde el Senado (después del padrón, antes de DPP)
      - name: Actualizar comisiones (integrantes y cargos, Senado)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
        continue-on-error: true
        env:
          ACTUALIZAR: "1"
        run: python scripts/scraper_comisiones.py

      - name: Scraper de DPP (comisiones)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
        continue-on-error: true
        run: python scripts/scraper_dpp.py

      - name: Scraper de agenda (boletines) - mañana
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
        continue-on-error: true
        run: python scripts/scraper_agenda.py

      # ── Franja 22:00 ART: OD + agenda (livianos) + proyectos (pesado) ────
      - name: Scraper de OD (órdenes del día)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
        continue-on-error: true
        run: python scripts/scraper_od.py

      # Ayuda Memoria automática: toma las OD de data/od.json, consulta su ESTADO en
      # el Senado (solo las PENDIENTES entran), baja los PDF y arma data/ayuda_memoria.json.
      # Los PDF van a /tmp (no se suben al repo) y se guardan en caché entre corridas.
      - name: Cache de PDF de OD
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
        uses: actions/cache@v4
        with:
          path: /tmp/pdfs_od
          key: pdfs-od-${{ github.run_id }}
          restore-keys: pdfs-od-

      - name: Ayuda Memoria automática (desde el Senado)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/actualizar_ayuda_memoria.py --pdfs /tmp/pdfs_od --comparar data/ayuda_memoria.json
          cp data/ayuda_memoria_auto.json data/ayuda_memoria.json

      - name: Scraper de agenda (boletines) - noche
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
        continue-on-error: true
        run: python scripts/scraper_agenda.py

      - name: Scraper de sanciones (Boletín de Novedades)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
        continue-on-error: true
        env:
          SANCIONES_REPROCESAR: ${{ github.event.inputs.reprocesar_sanciones }}
        run: python scripts/scraper_sanciones.py

      - name: Scraper de proyectos
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
        run: python scripts/scraper_proyectos.py

      - name: Actualizar pliegos judiciales (fichas del Senado)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
        continue-on-error: true
        env:
          ACTUALIZAR: "1"
        run: python scripts/scraper_pliegos.py

      - name: Noticias del Senado (para la Agenda)
        continue-on-error: true
        run: python scripts/scraper_noticias.py

      - name: Generar web
        run: python scripts/generar_web.py

      - name: Generar diseño nuevo
        run: python scripts/generar_diseno_nuevo.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios; nada que commitear."
          else
            git commit -m "Actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi