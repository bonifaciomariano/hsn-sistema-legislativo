name: Actualizar datos legislativos

# Dos franjas separadas para no mezclar el scraper pesado (proyectos, ~5-6
# min y muchas requests) con los livianos de la otra franja: si un scraper
# agota el rate-limit del sitio para la IP del runner, los que corren
# después en el MISMO job fallan en cascada (visto en la práctica: DPP,
# agenda y OD volvían con 0 resultados corriendo justo después de
# proyectos). Separarlos por horario, además de reordenar liviano-antes-que-
# pesado dentro de cada franja, reduce ese riesgo.
#
# Sanciones (Boletín de Novedades) se sacó del todo: ese endpoint
# (micrositios/DatosAbiertos) devuelve "Request Rejected" de forma mucho más
# dura que el resto — no parece ser sólo rate-limit. Mariano lo carga a mano
# por ahora (pendiente: revisar/rediseñar esa sección).
on:
  schedule:
    # 10:00 Argentina (UTC-3) = 13:00 UTC, lunes a viernes → proyectos + OD
    - cron: "0 13 * * 1-5"
    # 21:00 Argentina (UTC-3) = 00:00 UTC del día siguiente, martes a sábado → DPP + agenda
    - cron: "0 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ── Franja 10:00 ART: proyectos + OD (liviano primero) ──────────────
      - name: Scraper de OD (órdenes del día)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * 1-5'
        continue-on-error: true
        run: python scripts/scraper_od.py

      - name: Scraper de proyectos
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * 1-5'
        run: python scripts/scraper_proyectos.py

      # ── Franja 21:00 ART: DPP + agenda ───────────────────────────────────
      - name: Scraper de DPP (comisiones)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 2-6'
        continue-on-error: true
        run: python scripts/scraper_dpp.py

      - name: Scraper de agenda (boletines)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 2-6'
        continue-on-error: true
        run: python scripts/scraper_agenda.py

      - name: Generar web
        run: python scripts/generar_web.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios; nada que commitear."
          else
            git commit -m "Actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
